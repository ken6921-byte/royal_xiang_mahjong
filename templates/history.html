<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史戰績 - 皇翔娛樂城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("/static/mahjong_bg.png");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .main-wrapper { background: rgba(255,255,255,0.93); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .score-positive { color: blue; font-weight: bold; }
        .score-negative { color: red; font-weight: bold; }
        .dong-qian { color: #f77f00; font-weight: bold; }
        .calligraphy-font { font-family: 'BiauKai','DFKai-SB','KaiTi',serif; font-weight: 900; }
    </style>
</head>
<body>
<div class="container py-5">
<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="calligraphy-font text-danger">🔍 歷史戰績查詢</h2>
        <a href="/" class="btn btn-secondary">🏠 返回首頁</a>
    </div>
    <div class="card mb-4 shadow-sm">
        <div class="card-body bg-white">
            <form action="/history" method="GET" class="row g-3 align-items-center">
                <div class="col-auto"><label class="fw-bold">篩選玩家：</label></div>
                <div class="col-auto">
                    <select name="player_name" class="form-select">
                        <option value="全部">顯示全部</option>
                        {% for player in players %}
                        <option value="{{ player }}" {% if current_filter == player %}selected{% endif %}>{{ player }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-primary">查詢</button></div>
            </form>
        </div>
    </div>

    {% if records|length == 0 %}
    <div class="text-center py-5 text-muted">查無紀錄</div>
    {% endif %}

    {% for row in records %}
    <div class="card mb-3 shadow-sm" style="border-left: 5px solid #d90429;">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                <span class="text-muted small">📅 {{ row.date[:16] }}</span>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark">💰 東錢: -{{ row.dong }}</span>
                    <a href="/edit_record/{{ row.id }}" class="btn btn-outline-primary btn-sm">✏️ 編輯</a>
                    <form action="/delete_record/{{ row.id }}" method="POST" onsubmit="return confirm('確定刪除這筆記錄？');" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">🗑️ 刪除</button>
                    </form>
                </div>
            </div>
            <div class="row g-2">
                {% for p in row.data %}
                <div class="col-6 col-md-3">
                    <div class="text-center border rounded p-2 bg-light">
                        <div class="fw-bold">{{ p.name }}</div>
                        <div class="fs-5 {{ 'score-positive' if p.score > 0 else 'score-negative' }}">{{ p.score }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</div>
</body>
</html>
