<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯戰績 - 皇翔娛樂城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-image: url("/static/mahjong_bg.png"); background-size: cover; background-attachment: fixed; background-position: center; }
        .main-wrapper { background: rgba(255,255,255,0.93); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .calligraphy-font { font-family: 'BiauKai','DFKai-SB','KaiTi',serif; font-weight: 900; }
    </style>
</head>
<body>
<div class="container py-5">
<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="calligraphy-font text-danger">✏️ 編輯戰績</h2>
        <a href="/history" class="btn btn-secondary">↩️ 返回歷史</a>
    </div>
    <div class="text-muted mb-3 small">📅 {{ record.date[:16] }}</div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/edit_record/{{ record.id }}" method="POST" oninput="validateSum()">
                <div id="playersContainer">
                    {% for p in record.data %}
                    <div class="row mb-2 align-items-center">
                        <div class="col-5">
                            <select name="player_name[]" class="form-select">
                                {% for player in players %}
                                <option value="{{ player }}" {% if player == p.name %}selected{% endif %}>{{ player }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-5">
                            <input type="number" name="player_score[]" class="form-control score-input" value="{{ p.score }}" required>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="alert alert-light text-center border mt-3">
                    總和 <span id="playerSumDisplay" class="fw-bold">0</span> +
                    東錢 <span id="dongDisplay" class="fw-bold text-warning">0</span> =
                    <span id="finalSumDisplay" class="fw-bold">0</span>
                    <br><span id="statusMessage" class="mt-1 d-inline-block"></span>
                </div>

                <div class="row mb-3 align-items-center p-3 bg-warning bg-opacity-10 rounded mx-0">
                    <div class="col-md-2 fw-bold text-danger">💰 東錢</div>
                    <div class="col-md-4">
                        <input type="number" id="dongInput" name="dong_qian" class="form-control" value="{{ record.dong }}" oninput="validateSum()">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-danger w-100 py-2 fs-5">💾 儲存修改</button>
            </form>
        </div>
    </div>
</div>
</div>
<script>
function validateSum() {
    let inputs = document.querySelectorAll('input[name="player_score[]"]');
    let total = 0;
    inputs.forEach(function(i) { total += (parseInt(i.value) || 0); });
    let dong = parseInt(document.getElementById('dongInput').value) || 0;
    let final = total + dong;
    document.getElementById('playerSumDisplay').textContent = total;
    document.getElementById('dongDisplay').textContent = dong;
    let fs = document.getElementById('finalSumDisplay');
    let msg = document.getElementById('statusMessage');
    let btn = document.getElementById('submitBtn');
    fs.textContent = final;
    if (final === 0) {
        fs.style.color = 'green';
        msg.textContent = '✅ 帳目平衡';
        msg.className = 'mt-1 d-inline-block text-success fw-bold';
        btn.disabled = false;
    } else {
        fs.style.color = 'red';
        msg.textContent = '❌ 帳目不平';
        msg.className = 'mt-1 d-inline-block text-danger fw-bold';
        btn.disabled = true;
    }
}
window.onload = validateSum;
</script>
</body>
</html>
